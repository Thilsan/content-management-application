services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-cms}
      MYSQL_USER: ${DB_USERNAME:-cms}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    volumes:
      - db-data:/var/lib/mysql
    ports:
      - "${DB_FORWARD_PORT:-33061}:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${DB_ROOT_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 30

  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-cms}
      DB_USERNAME: ${DB_USERNAME:-cms}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      APP_URL: http://localhost:${APP_PORT:-8000}
      FRONTEND_URL: http://localhost:${WEB_PORT:-5173}
      L5_SWAGGER_CONST_HOST: http://localhost:${APP_PORT:-8000}
      FILESYSTEM_DISK: public
    volumes:
      - ./backend:/var/www/html
    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${APP_PORT:-8000}:80"
    volumes:
      - ./backend:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  web:
    build:
      context: ./frontend
      target: dev
    ports:
      - "${WEB_PORT:-5173}:5173"
    environment:
      VITE_API_URL: http://localhost:${APP_PORT:-8000}
    volumes:
      - ./frontend:/app
      - frontend-modules:/app/node_modules
    depends_on:
      - nginx

volumes:
  db-data:
  frontend-modules:
